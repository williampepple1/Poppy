name: CI & Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.4.5 or latest)'
        required: true
        default: 'latest'
      draft:
        description: 'Create as draft release'
        type: boolean
        default: false
      prerelease:
        description: 'Create as pre-release'
        type: boolean
        default: false

concurrency:
  group: ci-release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build & Package (Windows)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ninja
        run: choco install ninja -y

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          arch: win64_msvc2019_64
          cache: true

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Run CTest
        run: |
          ctest --test-dir build --output-on-failure -C Release

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Package Windows Release (windeployqt & Inno Setup)
        shell: pwsh
        run: |
          $dist = "dist/Poppy"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Copy-Item build/bin/poppy.exe $dist/
          Copy-Item build/bin/poppy-cli.exe $dist/
          Copy-Item README.md $dist/
          Copy-Item LICENSE $dist/
          if (Test-Path assets) { Copy-Item -Recurse assets $dist/ }
          if (Test-Path examples) { Copy-Item -Recurse examples $dist/ }
          windeployqt "$dist/poppy.exe" --no-translations --compiler-runtime
          Compress-Archive -Path "$dist/*" -DestinationPath "Poppy-windows-x64.zip" -Force
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/poppy_setup.iss
          Copy-Item release-installer/Poppy-windows-x64-setup.exe .

      - name: Upload Windows Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Poppy-windows-x64
          path: |
            Poppy-windows-x64.zip
            Poppy-windows-x64-setup.exe

  build-linux:
    name: Build & Package (Linux)
    runs-on: ubuntu-latest

    env:
      QT_QPA_PLATFORM: offscreen

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential ninja-build qt6-base-dev qt6-declarative-dev libgl1-mesa-dev libxkbcommon-dev libx11-xcb-dev libssl-dev

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Run CTest
        run: |
          ctest --test-dir build --output-on-failure -C Release

      - name: Package Linux Release
        run: |
          mkdir -p dist/Poppy
          cp build/bin/poppy dist/Poppy/
          cp build/bin/poppy-cli dist/Poppy/
          cp README.md dist/Poppy/
          cp LICENSE dist/Poppy/
          cp -r assets dist/Poppy/
          cp -r examples dist/Poppy/
          tar -czvf Poppy-linux-x64.tar.gz -C dist/Poppy .

      - name: Upload Linux Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Poppy-linux-x64
          path: Poppy-linux-x64.tar.gz

  build-macos:
    name: Build & Package (macOS)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ninja
        run: brew install ninja

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.2'
          cache: true

      - name: Fix Xcode 16 AGL removal
        run: |
          find "$RUNNER_WORKSPACE/Qt" -name "*.cmake" -exec sed -i '' 's/-framework AGL//g' {} + 2>/dev/null || true
          find "$RUNNER_WORKSPACE/Qt" -name "FindWrapOpenGL.cmake" -exec sed -i '' 's/AGL//g' {} + 2>/dev/null || true

      - name: Configure CMake
        run: |
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: |
          cmake --build build --config Release

      - name: Run CTest
        run: |
          ctest --test-dir build --output-on-failure -C Release

      - name: Package macOS Release (macdeployqt, DMG & Zip)
        run: |
          # Deploy Qt frameworks into the .app bundle
          macdeployqt build/bin/Poppy.app -always-overwrite || true

          # Create DMG with Applications symlink for drag-and-drop install
          mkdir -p dist/dmg
          cp -R build/bin/Poppy.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname Poppy -srcfolder dist/dmg -ov -format UDZO Poppy-macos.dmg

          # Create portable Zip archive with app bundle and CLI
          mkdir -p dist/zip
          cp -R build/bin/Poppy.app dist/zip/
          cp build/bin/poppy-cli dist/zip/
          cp README.md dist/zip/
          cp LICENSE dist/zip/
          ditto -c -k --sequesterRsrc dist/zip Poppy-macos.zip

      - name: Upload macOS Package Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Poppy-macos
          path: |
            Poppy-macos.dmg
            Poppy-macos.zip

  publish-release:
    name: Publish GitHub Release
    if: github.event_name != 'pull_request' && (github.ref_type == 'tag' || github.event_name == 'workflow_dispatch')
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Release Tag
        run: |
          SHORT_SHA="${GITHUB_SHA:0:7}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            DRAFT="${{ github.event.inputs.draft }}"
            PRERELEASE="${{ github.event.inputs.prerelease }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
            DRAFT="false"
            PRERELEASE="false"
          else
            TAG="latest"
            DRAFT="false"
            PRERELEASE="false"
          fi

          if [ "$TAG" = "latest" ]; then
            NAME="Poppy Latest ($SHORT_SHA)"
            BODY="Continuous deployment from \`main\` at ${{ github.sha }}."
          else
            NAME="Poppy $TAG"
            BODY=""
          fi

          {
            echo "RELEASE_TAG=$TAG"
            echo "RELEASE_NAME=$NAME"
            echo "RELEASE_DRAFT=$DRAFT"
            echo "RELEASE_PRERELEASE=$PRERELEASE"
            echo "RELEASE_BODY<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Point latest tag at this commit
        if: env.RELEASE_TAG == 'latest'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${{ github.sha }}"
          git push origin latest --force

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: Poppy-windows-x64
          path: release-assets

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: Poppy-linux-x64
          path: release-assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: Poppy-macos
          path: release-assets

      - name: Replace existing release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! gh release view "${{ env.RELEASE_TAG }}" >/dev/null 2>&1; then
            echo "No existing release for ${{ env.RELEASE_TAG }}; a new one will be created."
            exit 0
          fi
          gh release delete-asset "${{ env.RELEASE_TAG }}" Poppy-windows-x64-setup.exe --yes || true
          gh release delete-asset "${{ env.RELEASE_TAG }}" Poppy-windows-x64.zip --yes || true
          gh release delete-asset "${{ env.RELEASE_TAG }}" Poppy-linux-x64.tar.gz --yes || true
          gh release delete-asset "${{ env.RELEASE_TAG }}" Poppy-macos.dmg --yes || true
          gh release delete-asset "${{ env.RELEASE_TAG }}" Poppy-macos.zip --yes || true

      - name: Flatten and verify release assets
        run: |
          find release-assets -mindepth 2 -type f -exec mv -t release-assets/ {} + 2>/dev/null || true
          ls -la release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: ${{ env.RELEASE_NAME }}
          body: ${{ env.RELEASE_BODY }}
          draft: ${{ env.RELEASE_DRAFT == 'true' }}
          prerelease: ${{ env.RELEASE_PRERELEASE == 'true' }}
          make_latest: ${{ env.RELEASE_PRERELEASE != 'true' && env.RELEASE_DRAFT != 'true' }}
          generate_release_notes: true
          files: |
            release-assets/Poppy-windows-x64-setup.exe
            release-assets/Poppy-windows-x64.zip
            release-assets/Poppy-linux-x64.tar.gz
            release-assets/Poppy-macos.dmg
            release-assets/Poppy-macos.zip
